<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <!-- Sombrero top (red dome) -->
  <ellipse cx="100" cy="65" rx="40" ry="55" fill="#E8736C"/>
  <!-- Sombrero brim (teal) -->
  <ellipse cx="100" cy="95" rx="90" ry="22" fill="#4ECDC4"/>
  <!-- Brim bottom line -->
  <rect x="12" y="112" width="176" height="5" rx="2" fill="#4ECDC4"/>
  <!-- Triangle decorations on brim -->
  <polygon points="30,95 50,112 10,112" fill="#E8736C"/>
  <polygon points="70,95 90,112 50,112" fill="#E8736C"/>
  <polygon points="110,95 130,112 90,112" fill="#E8736C"/>
  <polygon points="150,95 170,112 130,112" fill="#E8736C"/>
  <!-- White gaps between triangles -->
  <polygon points="50,95 60,112 40,112" fill="white"/>
  <polygon points="90,95 100,112 80,112" fill="white"/>
  <polygon points="130,95 140,112 120,112" fill="white"/>
</svg>
